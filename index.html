<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#eef1f0" />
    <meta name="description" content="GreyMusicStudio의 작업실과 공식 문의 채널을 만나보세요." />
    <title>GreyMusicStudio — studio notes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="noise" aria-hidden="true"></div>
    <main class="site">
      <header class="masthead">
        <a class="wordmark" href="./index.html">GREY<span>MUSIC STUDIO</span></a>
        <button class="share" id="shareButton" type="button"><span>share</span><b>↗</b></button>
      </header>

      <div class="layout">
        <section class="intro">
          <p class="eyebrow">ENTERTAINMENT MIXING / 2026</p>
          <div class="portrait-wrap">
            <img class="portrait" src="./grey-musicstudio-logo.png" alt="GreyMusicStudio 로고" />
          </div>
          <h1>소리를 다듬는<br /><em>GreyMusicStudio</em></h1>
          <p class="intro-copy">전직 엔터 프로듀서, 12년차 음악인.<br />보컬의 매력을 가장 선명하게 들려주는 믹싱 · 디렉팅 · 레코딩 스튜디오입니다.</p>
        </section>

        <section class="studio" aria-label="GreyMusicStudio 공식 링크">
          <div class="studio-heading">
            <div><p class="eyebrow">CONTACT</p><h2>Get in touch</h2></div>
          </div>
          <div class="link-grid" id="links"></div>
          <p class="playlist-label">PORTFOLIO</p>
          <div class="playlist-links" id="playlists" aria-label="YouTube 플레이리스트"></div>
        </section>
      </div>

      <footer class="footer"><span>GREY MUSIC STUDIO</span><span>© 2026 GREY MUSIC STUDIO</span></footer>
    </main>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="./script.js"></script>
  </body>
</html>
